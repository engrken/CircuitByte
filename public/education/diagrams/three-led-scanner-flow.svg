<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img"><title>Three LED scanner — program flowchart</title><desc>Accessible visual guide showing the program flowchart for the CircuitByte Three LED scanner project. Refer to the accompanying connection table and safety notes before wiring.</desc><rect width="900" height="540" fill="#f8fafc"/><rect x="18" y="18" width="864" height="504" rx="16" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="46" y="64" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">THREE-LED SCANNER — FLOWCHART</text><text x="46" y="96" fill="#334155" font-family="Arial,sans-serif" font-size="17" text-anchor="start">One LED is ON at a time; the code runs continuously.</text><rect x="250" y="121" width="390" height="66" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="445" y="150" fill="#1e40af" font-family="Arial,sans-serif" font-size="21" text-anchor="middle">SETUP</text><text x="445" y="172" fill="#334155" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Set D8, D9 and D10 as outputs</text><rect x="250" y="219" width="390" height="66" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="445" y="248" fill="#1e40af" font-family="Arial,sans-serif" font-size="21" text-anchor="middle">FORWARD</text><text x="445" y="270" fill="#334155" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">LED 1 → LED 2 → LED 3</text><rect x="250" y="317" width="390" height="66" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="445" y="346" fill="#1e40af" font-family="Arial,sans-serif" font-size="21" text-anchor="middle">REVERSE</text><text x="445" y="368" fill="#334155" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">LED 2 only, then restart</text><rect x="250" y="415" width="390" height="66" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="445" y="444" fill="#1e40af" font-family="Arial,sans-serif" font-size="21" text-anchor="middle">REPEAT</text><text x="445" y="466" fill="#334155" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Run loop() again</text><line x1="445" y1="187" x2="445" y2="219" stroke="#2563eb" stroke-width="3"/><line x1="445" y1="285" x2="445" y2="317" stroke="#2563eb" stroke-width="3"/><line x1="445" y1="383" x2="445" y2="415" stroke="#2563eb" stroke-width="3"/><line x1="641" y1="450" x2="718" y2="450" stroke="#64748b" stroke-width="3"/><line x1="718" y1="450" x2="718" y2="250" stroke="#64748b" stroke-width="3"/><line x1="718" y1="250" x2="641" y2="250" stroke="#64748b" stroke-width="3"/><text x="729" y="351" fill="#64748b" font-family="Arial,sans-serif" font-size="15" text-anchor="start">REPEAT</text><text x="46" y="509" fill="#64748b" font-family="Arial,sans-serif" font-size="16" text-anchor="start">Arduino sketch uses an array, for loops and a reusable showLight() function.</text></svg>
