<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc"><title id="title">Build a local Wi-Fi room dashboard — module circuit schematic</title><desc id="desc">Controller pins connected to labelled peripheral terminals. All GND symbols share a common net. Separate positive supply nets must not be joined.</desc><rect width="1100" height="530" fill="#f8f9f5"/><text x="30" y="35" font-family="Arial,sans-serif" font-size="15" fill="#55734d" text-anchor="start">CIRCUITBYTE / MODULE CIRCUIT SCHEMATIC</text><text x="30" y="72" font-family="Arial,sans-serif" font-size="26" fill="#17332f" text-anchor="start">Build a local Wi-Fi room dashboard</text><text x="30" y="103" font-family="Arial,sans-serif" font-size="15" fill="#17332f" text-anchor="start">All GND symbols are connected. Named positive rails remain separate.</text><rect x="35" y="150" width="230" height="255" rx="14" fill="#173a32"/><text x="65" y="190" font-family="Arial,sans-serif" font-size="24" fill="#daf58e" text-anchor="start">ESP32</text><text x="65" y="220" font-family="Arial,sans-serif" font-size="15" fill="#d6e6d0" text-anchor="start">USB powered</text><text x="65" y="245" font-family="Arial,sans-serif" font-size="15" fill="#d6e6d0" text-anchor="start">Logic: 3.3 V</text><path d="M145 405 L145 422" stroke="#52665d" stroke-width="2.5" fill="none"/><path d="M130 422h30 M135 429h20 M140 436h10" stroke="#52665d" stroke-width="2"/><text x="145" y="456" font-family="Arial,sans-serif" font-size="13" fill="#17332f" text-anchor="middle">GND</text><rect x="720" y="185" width="340" height="130" rx="8" fill="white" stroke="#92aa8c" stroke-width="2"/><text x="735" y="215" font-family="Arial,sans-serif" font-size="20" fill="#17332f" text-anchor="start">DHT22</text><path d="M950 185 L950 165" stroke="#b66b40" stroke-width="2.5" fill="none"/><path d="M943 170 L950 160 L957 170" fill="none" stroke="#b66b40" stroke-width="2"/><text x="950" y="149" font-family="Arial,sans-serif" font-size="14" fill="#914d2b" text-anchor="middle">ESP32 3V3</text><text x="950" y="180" font-family="Arial,sans-serif" font-size="11" fill="#17332f" text-anchor="middle">VCC</text><path d="M950 315 L950 332" stroke="#52665d" stroke-width="2.5" fill="none"/><path d="M935 332h30 M940 339h20 M945 346h10" stroke="#52665d" stroke-width="2"/><text x="950" y="366" font-family="Arial,sans-serif" font-size="13" fill="#17332f" text-anchor="middle">GND</text><text x="250" y="242" font-family="Arial,sans-serif" font-size="18" fill="#daf58e" text-anchor="end">GPIO27</text><path d="M265 250 L720 250" stroke="#357f79" stroke-width="2.5" fill="none"/><circle cx="265" cy="250" r="4" fill="#daf58e"/><text x="735" y="256" font-family="Arial,sans-serif" font-size="16" fill="#17332f" text-anchor="start">DATA</text><circle cx="540" cy="250" r="4" fill="#357f79"/><path d="M540 250 L540 226" stroke="#357f79" stroke-width="2.5" fill="none"/><rect x="532" y="188" width="16" height="38" fill="#f8f9f5" stroke="#357f79" stroke-width="2"/><path d="M540 188 L540 168" stroke="#b66b40" stroke-width="2.5" fill="none"/><path d="M533 173 L540 163 L547 173" fill="none" stroke="#b66b40" stroke-width="2"/><text x="540" y="152" font-family="Arial,sans-serif" font-size="14" fill="#914d2b" text-anchor="middle">ESP32 3V3</text><text x="555" y="214" font-family="Arial,sans-serif" font-size="14" fill="#17332f" text-anchor="start">10 kΩ</text><text x="30" y="515" font-family="Arial,sans-serif" font-size="14" fill="#17332f" text-anchor="start">Use the full connection table for pin labels, power details, polarity and module-variant checks.</text></svg>