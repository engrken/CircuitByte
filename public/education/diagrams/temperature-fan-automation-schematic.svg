<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1020" viewBox="0 0 1100 1020" role="img" aria-labelledby="title desc"><title id="title">Build a temperature-controlled DC fan — module circuit schematic</title><desc id="desc">Controller pins connected to labelled peripheral terminals. All GND symbols share a common net. Separate positive supply nets must not be joined.</desc><rect width="1100" height="1020" fill="#f8f9f5"/><text x="30" y="35" font-family="Arial,sans-serif" font-size="15" fill="#55734d" text-anchor="start">CIRCUITBYTE / MODULE CIRCUIT SCHEMATIC</text><text x="30" y="72" font-family="Arial,sans-serif" font-size="26" fill="#17332f" text-anchor="start">Build a temperature-controlled DC fan</text><text x="30" y="103" font-family="Arial,sans-serif" font-size="15" fill="#17332f" text-anchor="start">All GND symbols are connected. Named positive rails remain separate.</text><rect x="35" y="150" width="230" height="525" rx="14" fill="#173a32"/><text x="65" y="190" font-family="Arial,sans-serif" font-size="24" fill="#daf58e" text-anchor="start">UNO R3</text><text x="65" y="220" font-family="Arial,sans-serif" font-size="15" fill="#d6e6d0" text-anchor="start">USB powered</text><text x="65" y="245" font-family="Arial,sans-serif" font-size="15" fill="#d6e6d0" text-anchor="start">Logic: 5 V</text><path d="M145 675 L145 692" stroke="#52665d" stroke-width="2.5" fill="none"/><path d="M130 692h30 M135 699h20 M140 706h10" stroke="#52665d" stroke-width="2"/><text x="145" y="726" font-family="Arial,sans-serif" font-size="13" fill="#17332f" text-anchor="middle">GND</text><rect x="720" y="185" width="340" height="130" rx="8" fill="white" stroke="#92aa8c" stroke-width="2"/><text x="735" y="215" font-family="Arial,sans-serif" font-size="20" fill="#17332f" text-anchor="start">DHT22</text><path d="M950 185 L950 165" stroke="#b66b40" stroke-width="2.5" fill="none"/><path d="M943 170 L950 160 L957 170" fill="none" stroke="#b66b40" stroke-width="2"/><text x="950" y="149" font-family="Arial,sans-serif" font-size="14" fill="#914d2b" text-anchor="middle">UNO +5V</text><text x="950" y="180" font-family="Arial,sans-serif" font-size="11" fill="#17332f" text-anchor="middle">VCC</text><path d="M950 315 L950 332" stroke="#52665d" stroke-width="2.5" fill="none"/><path d="M935 332h30 M940 339h20 M945 346h10" stroke="#52665d" stroke-width="2"/><text x="950" y="366" font-family="Arial,sans-serif" font-size="13" fill="#17332f" text-anchor="middle">GND</text><text x="250" y="242" font-family="Arial,sans-serif" font-size="18" fill="#daf58e" text-anchor="end">D2</text><path d="M265 250 L720 250" stroke="#357f79" stroke-width="2.5" fill="none"/><circle cx="265" cy="250" r="4" fill="#daf58e"/><text x="735" y="256" font-family="Arial,sans-serif" font-size="16" fill="#17332f" text-anchor="start">DATA</text><circle cx="540" cy="250" r="4" fill="#357f79"/><path d="M540 250 L540 226" stroke="#357f79" stroke-width="2.5" fill="none"/><rect x="532" y="188" width="16" height="38" fill="#f8f9f5" stroke="#357f79" stroke-width="2"/><path d="M540 188 L540 168" stroke="#b66b40" stroke-width="2.5" fill="none"/><path d="M533 173 L540 163 L547 173" fill="none" stroke="#b66b40" stroke-width="2"/><text x="540" y="152" font-family="Arial,sans-serif" font-size="14" fill="#914d2b" text-anchor="middle">UNO +5V</text><text x="555" y="214" font-family="Arial,sans-serif" font-size="14" fill="#17332f" text-anchor="start">10 kΩ</text><rect x="720" y="455" width="340" height="130" rx="8" fill="white" stroke="#92aa8c" stroke-width="2"/><text x="735" y="485" font-family="Arial,sans-serif" font-size="20" fill="#17332f" text-anchor="start">5 V relay module</text><path d="M950 455 L950 435" stroke="#b66b40" stroke-width="2.5" fill="none"/><path d="M943 440 L950 430 L957 440" fill="none" stroke="#b66b40" stroke-width="2"/><text x="950" y="419" font-family="Arial,sans-serif" font-size="14" fill="#914d2b" text-anchor="middle">EXT +5V</text><text x="950" y="450" font-family="Arial,sans-serif" font-size="11" fill="#17332f" text-anchor="middle">VCC</text><path d="M950 585 L950 602" stroke="#52665d" stroke-width="2.5" fill="none"/><path d="M935 602h30 M940 609h20 M945 616h10" stroke="#52665d" stroke-width="2"/><text x="950" y="636" font-family="Arial,sans-serif" font-size="13" fill="#17332f" text-anchor="middle">GND</text><text x="250" y="512" font-family="Arial,sans-serif" font-size="18" fill="#daf58e" text-anchor="end">D8</text><path d="M265 520 L720 520" stroke="#357f79" stroke-width="2.5" fill="none"/><circle cx="265" cy="520" r="4" fill="#daf58e"/><text x="735" y="526" font-family="Arial,sans-serif" font-size="16" fill="#17332f" text-anchor="start">IN</text><text x="740" y="565" font-family="Arial,sans-serif" font-size="14" fill="#17332f" text-anchor="start">COM / NO contacts: see below</text><text x="320" y="760" font-family="Arial,sans-serif" font-size="17" fill="#55734d" text-anchor="start">SEPARATE 5 V DC LOAD CIRCUIT</text><path d="M360 840 L360 820" stroke="#b66b40" stroke-width="2.5" fill="none"/><path d="M353 825 L360 815 L367 825" fill="none" stroke="#b66b40" stroke-width="2"/><text x="360" y="804" font-family="Arial,sans-serif" font-size="14" fill="#914d2b" text-anchor="middle">EXT +5V</text><path d="M360 840 L470 840" stroke="#357f79" stroke-width="2.5" fill="none"/><text x="400" y="826" font-family="Arial,sans-serif" font-size="14" fill="#17332f" text-anchor="start">COM</text><circle cx="470" cy="840" r="4" fill="#357f79"/><circle cx="550" cy="840" r="4" fill="#357f79"/><path d="M470 840 L535 818" stroke="#357f79" stroke-width="2.5" fill="none"/><text x="540" y="872" font-family="Arial,sans-serif" font-size="14" fill="#17332f" text-anchor="start">NO</text><path d="M550 840 L720 840" stroke="#357f79" stroke-width="2.5" fill="none"/><rect x="720" y="810" width="155" height="70" rx="7" fill="white" stroke="#357f79"/><text x="737" y="840" font-family="Arial,sans-serif" font-size="16" fill="#17332f" text-anchor="start">5 V DC fan</text><text x="735" y="863" font-family="Arial,sans-serif" font-size="15" fill="#17332f" text-anchor="start">+</text><text x="858" y="863" font-family="Arial,sans-serif" font-size="15" fill="#17332f" text-anchor="start">−</text><path d="M875 840 L980 840" stroke="#357f79" stroke-width="2.5" fill="none"/><path d="M980 840 L980 857" stroke="#52665d" stroke-width="2.5" fill="none"/><path d="M965 857h30 M970 864h20 M975 871h10" stroke="#52665d" stroke-width="2"/><text x="980" y="891" font-family="Arial,sans-serif" font-size="13" fill="#17332f" text-anchor="middle">GND</text><path d="M650 840 L650 920" stroke="#357f79" stroke-width="2.5" fill="none"/><path d="M650 920 L720 920" stroke="#357f79" stroke-width="2.5" fill="none"/><rect x="720" y="896" width="155" height="48" fill="white" stroke="#357f79"/><text x="797" y="915" font-family="Arial,sans-serif" font-size="14" fill="#17332f" text-anchor="middle">1N4007</text><text x="797" y="936" font-family="Arial,sans-serif" font-size="12" fill="#17332f" text-anchor="middle">K (band) ← | → A</text><path d="M875 920 L930 920" stroke="#357f79" stroke-width="2.5" fill="none"/><path d="M930 920 L930 840" stroke="#357f79" stroke-width="2.5" fill="none"/><circle cx="650" cy="840" r="4" fill="#357f79"/><circle cx="930" cy="840" r="4" fill="#357f79"/><text x="320" y="975" font-family="Arial,sans-serif" font-size="15" fill="#17332f" text-anchor="start">NO closes when relay is energized. NC is unused. Do not connect mains.</text><text x="30" y="1005" font-family="Arial,sans-serif" font-size="14" fill="#17332f" text-anchor="start">Use the full connection table for pin labels, power details, polarity and module-variant checks.</text></svg>