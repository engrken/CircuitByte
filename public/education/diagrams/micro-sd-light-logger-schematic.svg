<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640"><title>MicroSD light-level CSV logger — schematic connection diagram</title><desc>Accessible visual guide showing the schematic connection diagram for the CircuitByte MicroSD light-level CSV logger project. Refer to the accompanying connection table and safety notes before wiring.</desc><rect width="960" height="640" fill="#fff"/><text x="40" y="53" fill="#1e293b" font-family="Arial,sans-serif" font-size="27">microSD Light-Level Logger</text><text x="40" y="82" fill="#1e293b" font-family="Arial,sans-serif" font-size="18">FUNCTIONAL SCHEMATIC - verify level shifting BEFORE connecting</text><rect x="33" y="125" width="208" height="433" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><rect x="726" y="125" width="205" height="433" rx="8" fill="#ecfdf5" stroke="#94a3b8" stroke-width="2"/><text x="83" y="158" fill="#1e293b" font-family="Arial,sans-serif" font-size="18">ARDUINO UNO</text><text x="760" y="158" fill="#1e293b" font-family="Arial,sans-serif" font-size="18">PERIPHERALS</text><text x="47" y="197" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">UNO 5V</text><line x1="241" y1="192" x2="360" y2="192" stroke="#475569" stroke-width="2"/><rect x="360" y="174" width="256" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="370" y="197" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">Verify sensor supply</text><line x1="616" y1="192" x2="726" y2="192" stroke="#475569" stroke-width="2"/><text x="735" y="197" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">LDR VCC</text><text x="47" y="242" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">UNO GND</text><line x1="241" y1="237" x2="360" y2="237" stroke="#475569" stroke-width="2"/><rect x="360" y="219" width="256" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="370" y="242" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">Common ground</text><line x1="616" y1="237" x2="726" y2="237" stroke="#475569" stroke-width="2"/><text x="735" y="242" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">LDR + SD GND</text><text x="47" y="287" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">UNO A0</text><line x1="241" y1="282" x2="360" y2="282" stroke="#475569" stroke-width="2"/><rect x="360" y="264" width="256" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="370" y="287" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">Analog sensor output</text><line x1="616" y1="282" x2="726" y2="282" stroke="#475569" stroke-width="2"/><text x="735" y="287" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">LDR AO</text><text x="47" y="332" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">UNO D10</text><line x1="241" y1="327" x2="360" y2="327" stroke="#475569" stroke-width="2"/><rect x="360" y="309" width="256" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="370" y="332" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">Level shift if required</text><line x1="616" y1="327" x2="726" y2="327" stroke="#475569" stroke-width="2"/><text x="735" y="332" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">SD CS</text><text x="47" y="377" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">UNO D11</text><line x1="241" y1="372" x2="360" y2="372" stroke="#475569" stroke-width="2"/><rect x="360" y="354" width="256" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="370" y="377" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">Level shift if required</text><line x1="616" y1="372" x2="726" y2="372" stroke="#475569" stroke-width="2"/><text x="735" y="377" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">SD MOSI</text><text x="47" y="422" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">UNO D12</text><line x1="241" y1="417" x2="360" y2="417" stroke="#475569" stroke-width="2"/><rect x="360" y="399" width="256" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="370" y="422" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">3.3 V return to UNO</text><line x1="616" y1="417" x2="726" y2="417" stroke="#475569" stroke-width="2"/><text x="735" y="422" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">SD MISO</text><text x="47" y="467" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">UNO D13</text><line x1="241" y1="462" x2="360" y2="462" stroke="#475569" stroke-width="2"/><rect x="360" y="444" width="256" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="370" y="467" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">Level shift if required</text><line x1="616" y1="462" x2="726" y2="462" stroke="#475569" stroke-width="2"/><text x="735" y="467" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">SD SCK</text><text x="47" y="512" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">Approved VCC</text><line x1="241" y1="507" x2="360" y2="507" stroke="#475569" stroke-width="2"/><rect x="360" y="489" width="256" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="370" y="512" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">Verify SD adapter rating</text><line x1="616" y1="507" x2="726" y2="507" stroke="#475569" stroke-width="2"/><text x="735" y="512" fill="#1e293b" font-family="Arial,sans-serif" font-size="14">SD VCC</text><text x="39" y="585" fill="#b45309" font-family="Arial,sans-serif" font-size="16">A regulator alone does not make 3.3 V-only SPI inputs tolerate 5 V.</text><text x="39" y="608" fill="#b45309" font-family="Arial,sans-serif" font-size="16">Use 5 V-compatible adapter or a properly selected level shifter.</text></svg>
