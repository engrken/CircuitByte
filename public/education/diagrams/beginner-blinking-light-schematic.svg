<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc"><title id="title">Make your first blinking light — module circuit schematic</title><desc id="desc">Controller pins connected to labelled peripheral terminals. All GND symbols share a common net. Separate positive supply nets must not be joined.</desc><rect width="1100" height="530" fill="#f8f9f5"/><text x="30" y="35" font-family="Arial,sans-serif" font-size="15" fill="#55734d" text-anchor="start">CIRCUITBYTE / MODULE CIRCUIT SCHEMATIC</text><text x="30" y="72" font-family="Arial,sans-serif" font-size="26" fill="#17332f" text-anchor="start">Make your first blinking light</text><text x="30" y="103" font-family="Arial,sans-serif" font-size="15" fill="#17332f" text-anchor="start">All GND symbols are connected. Named positive rails remain separate.</text><rect x="35" y="150" width="230" height="255" rx="14" fill="#173a32"/><text x="65" y="190" font-family="Arial,sans-serif" font-size="24" fill="#daf58e" text-anchor="start">UNO R3</text><text x="65" y="220" font-family="Arial,sans-serif" font-size="15" fill="#d6e6d0" text-anchor="start">USB powered</text><text x="65" y="245" font-family="Arial,sans-serif" font-size="15" fill="#d6e6d0" text-anchor="start">Logic: 5 V</text><path d="M145 405 L145 422" stroke="#52665d" stroke-width="2.5" fill="none"/><path d="M130 422h30 M135 429h20 M140 436h10" stroke="#52665d" stroke-width="2"/><text x="145" y="456" font-family="Arial,sans-serif" font-size="13" fill="#17332f" text-anchor="middle">GND</text><rect x="720" y="185" width="340" height="130" rx="8" fill="white" stroke="#92aa8c" stroke-width="2"/><text x="735" y="215" font-family="Arial,sans-serif" font-size="20" fill="#17332f" text-anchor="start">Red LED</text><path d="M950 315 L950 332" stroke="#52665d" stroke-width="2.5" fill="none"/><path d="M935 332h30 M940 339h20 M945 346h10" stroke="#52665d" stroke-width="2"/><text x="950" y="366" font-family="Arial,sans-serif" font-size="13" fill="#17332f" text-anchor="middle">GND</text><text x="250" y="242" font-family="Arial,sans-serif" font-size="18" fill="#daf58e" text-anchor="end">D9</text><path d="M265 250 L720 250" stroke="#357f79" stroke-width="2.5" fill="none"/><circle cx="265" cy="250" r="4" fill="#daf58e"/><text x="735" y="256" font-family="Arial,sans-serif" font-size="16" fill="#17332f" text-anchor="start">Anode</text><rect x="440" y="240" width="80" height="20" fill="#f8f9f5" stroke="#357f79" stroke-width="2"/><text x="480" y="230" font-family="Arial,sans-serif" font-size="16" fill="#17332f" text-anchor="middle">330 Ω</text><text x="880" y="295" font-family="Arial,sans-serif" font-size="14" fill="#17332f" text-anchor="start">Cathode (−) → GND</text><text x="30" y="515" font-family="Arial,sans-serif" font-size="14" fill="#17332f" text-anchor="start">Use the full connection table for pin labels, power details, polarity and module-variant checks.</text></svg>