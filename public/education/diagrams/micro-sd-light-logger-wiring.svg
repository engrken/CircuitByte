<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640"><title>MicroSD light-level CSV logger — pin to pin wiring map</title><desc>Accessible visual guide showing the pin to pin wiring map for the CircuitByte MicroSD light-level CSV logger project. Refer to the connection table and safety notes before wiring.</desc><rect width="960" height="640" fill="#fff"/><text x="40" y="53" fill="#1e293b" font-family="Arial,sans-serif" font-size="27">microSD Light-Level Logger</text><text x="40" y="82" fill="#1e293b" font-family="Arial,sans-serif" font-size="18">PIN WIRING MAP - use a compatible 5 V interface or add translation</text><rect x="29" y="110" width="900" height="40" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="44" y="138" fill="#1e293b" font-family="Arial,sans-serif" font-size="17">SOURCE</text><text x="331" y="138" fill="#1e293b" font-family="Arial,sans-serif" font-size="17">SIGNAL / SAFETY CHECK</text><text x="722" y="138" fill="#1e293b" font-family="Arial,sans-serif" font-size="17">TO</text><rect x="29" y="161" width="900" height="45" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="42" y="190" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">UNO 5V</text><text x="331" y="190" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">Verify sensor supply</text><text x="722" y="190" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">LDR VCC</text><rect x="29" y="207" width="900" height="45" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="42" y="236" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">UNO GND</text><text x="331" y="236" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">Common ground</text><text x="722" y="236" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">LDR + SD GND</text><rect x="29" y="253" width="900" height="45" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="42" y="282" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">UNO A0</text><text x="331" y="282" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">Analog sensor output</text><text x="722" y="282" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">LDR AO</text><rect x="29" y="299" width="900" height="45" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="42" y="328" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">UNO D10</text><text x="331" y="328" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">Level shift if required</text><text x="722" y="328" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">SD CS</text><rect x="29" y="345" width="900" height="45" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="42" y="374" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">UNO D11</text><text x="331" y="374" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">Level shift if required</text><text x="722" y="374" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">SD MOSI</text><rect x="29" y="391" width="900" height="45" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="42" y="420" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">UNO D12</text><text x="331" y="420" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">3.3 V return to UNO</text><text x="722" y="420" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">SD MISO</text><rect x="29" y="437" width="900" height="45" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="42" y="466" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">UNO D13</text><text x="331" y="466" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">Level shift if required</text><text x="722" y="466" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">SD SCK</text><rect x="29" y="483" width="900" height="45" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="42" y="512" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">Approved VCC</text><text x="331" y="512" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">Verify SD adapter rating</text><text x="722" y="512" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">SD VCC</text><text x="39" y="557" fill="#b45309" font-family="Arial,sans-serif" font-size="16">SD card slot is not hot-pluggable while logging.</text><text x="39" y="581" fill="#1e293b" font-family="Arial,sans-serif" font-size="15">Stop the sketch and remove power before extracting the card.</text></svg>
