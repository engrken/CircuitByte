<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640"><rect width="960" height="640" fill="#fff"/><text x="40" y="53" fill="#1e293b" font-family="Arial,sans-serif" font-size="27">microSD Light-Level Logger</text><text x="40" y="82" fill="#1e293b" font-family="Arial,sans-serif" font-size="18">LOGGING FLOWCHART - source-level design</text><rect x="202" y="111" width="550" height="54" rx="8" fill="#eef6ff" stroke="#94a3b8" stroke-width="2"/><text x="226" y="144" fill="#1e293b" font-family="Arial,sans-serif" font-size="18">Initialize SD card over SPI</text><path d="M480 165 v18" stroke="#64748b" stroke-width="3"/><rect x="202" y="186" width="550" height="54" rx="8" fill="#ecfdf5" stroke="#94a3b8" stroke-width="2"/><text x="226" y="219" fill="#1e293b" font-family="Arial,sans-serif" font-size="18">Read LDR AO every 5000 ms</text><path d="M480 240 v18" stroke="#64748b" stroke-width="3"/><rect x="202" y="261" width="550" height="54" rx="8" fill="#eef6ff" stroke="#94a3b8" stroke-width="2"/><text x="226" y="294" fill="#1e293b" font-family="Arial,sans-serif" font-size="18">Skip and report error if SD unavailable</text><path d="M480 315 v18" stroke="#64748b" stroke-width="3"/><rect x="202" y="336" width="550" height="54" rx="8" fill="#ecfdf5" stroke="#94a3b8" stroke-width="2"/><text x="226" y="369" fill="#1e293b" font-family="Arial,sans-serif" font-size="18">Open LIGHT.CSV; add header if new</text><path d="M480 390 v18" stroke="#64748b" stroke-width="3"/><rect x="202" y="411" width="550" height="54" rx="8" fill="#eef6ff" stroke="#94a3b8" stroke-width="2"/><text x="226" y="444" fill="#1e293b" font-family="Arial,sans-serif" font-size="18">Append uptime_ms,light_adc and close file</text><path d="M480 465 v18" stroke="#64748b" stroke-width="3"/><rect x="202" y="486" width="550" height="54" rx="8" fill="#ecfdf5" stroke="#94a3b8" stroke-width="2"/><text x="226" y="519" fill="#1e293b" font-family="Arial,sans-serif" font-size="18">Repeat; reinitialize on SD failure</text><text x="39" y="604" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">Time is uptime since boot; not calendar time.</text></svg>
