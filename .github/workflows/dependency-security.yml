name: Dependency security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Audit .
        working-directory: .
        run: npm audit --package-lock-only --ignore-scripts --omit=dev --audit-level=high
      - name: Audit ./services/copilot
        working-directory: ./services/copilot
        run: npm audit --package-lock-only --ignore-scripts --omit=dev --audit-level=high
