<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640"><rect width="960" height="640" fill="white"/><text x="38" y="54" fill="#1e293b" font-family="Arial,sans-serif" font-size="27">LCD Room Comfort Monitor</text><text x="38" y="86" fill="#1e293b" font-family="Arial,sans-serif" font-size="18">OPERATION FLOWCHART - sampled no faster than every 2.5 seconds</text><rect x="205" y="110" width="550" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="235" y="144" fill="#1e293b" font-family="Arial,sans-serif" font-size="19">Initialize LCD and DHT22</text><path d="M480 164 v19" stroke="#64748b" stroke-width="3"/><rect x="205" y="185" width="550" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="235" y="219" fill="#1e293b" font-family="Arial,sans-serif" font-size="19">Wait for sample interval</text><path d="M480 239 v19" stroke="#64748b" stroke-width="3"/><rect x="205" y="260" width="550" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="235" y="294" fill="#1e293b" font-family="Arial,sans-serif" font-size="19">Read humidity and temperature</text><path d="M480 314 v19" stroke="#64748b" stroke-width="3"/><rect x="205" y="335" width="550" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="235" y="369" fill="#1e293b" font-family="Arial,sans-serif" font-size="19">Check for invalid reading</text><path d="M480 389 v19" stroke="#64748b" stroke-width="3"/><rect x="205" y="410" width="550" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="235" y="444" fill="#1e293b" font-family="Arial,sans-serif" font-size="19">Show values or Sensor error on LCD</text><path d="M480 464 v19" stroke="#64748b" stroke-width="3"/><rect x="205" y="485" width="550" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="235" y="519" fill="#1e293b" font-family="Arial,sans-serif" font-size="19">Repeat</text></svg>
