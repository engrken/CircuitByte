<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Make your first blinking light — wiring schematic</title><desc id="desc">Labelled pin-to-pin connections. Repeated ground and supply names are the same net. Read the companion wiring table and module-variant notes.</desc><rect width="1200" height="600" fill="#f8f9f5"/><text x="35" y="42" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#50744b">CIRCUITBYTE / WIRING SCHEMATIC</text><text x="35" y="80" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17332f">Make your first blinking light</text><text x="35" y="118" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#17332f">Labelled nets, not physical pin positions. Repeated net names are electrically connected.</text><text x="35" y="170" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#64716c">SOURCE / PIN</text><text x="435" y="170" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#64716c">CONNECTION / COMPONENT</text><text x="835" y="170" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#64716c">DESTINATION / PIN</text><rect x="25" y="190" width="1150" height="108" rx="9" fill="white" stroke="#dce1d7"/><rect x="35" y="200" width="310" height="83" rx="6" fill="#edf2e7"/><rect x="435" y="200" width="320" height="83" rx="6" fill="#edf2e7"/><rect x="835" y="200" width="320" height="83" rx="6" fill="#edf2e7"/><path d="M345 240 H435 M755 240 H835" stroke="#33735f" stroke-width="3" fill="none"/><circle cx="345" cy="240" r="4" fill="#33735f"/><circle cx="435" cy="240" r="4" fill="#33735f"/><circle cx="755" cy="240" r="4" fill="#33735f"/><circle cx="835" cy="240" r="4" fill="#33735f"/><text x="48" y="223" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17332f">UNO D9</text><text x="448" y="223" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17332f">330 Ω resistor</text><text x="848" y="223" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17332f">LED anode (+)</text><rect x="25" y="315" width="1150" height="108" rx="9" fill="white" stroke="#dce1d7"/><rect x="35" y="325" width="310" height="83" rx="6" fill="#edf2e7"/><rect x="435" y="325" width="320" height="83" rx="6" fill="#edf2e7"/><rect x="835" y="325" width="320" height="83" rx="6" fill="#edf2e7"/><path d="M345 365 H435 M755 365 H835" stroke="#33735f" stroke-width="3" fill="none"/><circle cx="345" cy="365" r="4" fill="#33735f"/><circle cx="435" cy="365" r="4" fill="#33735f"/><circle cx="755" cy="365" r="4" fill="#33735f"/><circle cx="835" cy="365" r="4" fill="#33735f"/><text x="48" y="348" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17332f">LED cathode (−)</text><text x="448" y="348" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17332f">Jumper wire</text><text x="848" y="348" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17332f">UNO GND</text><rect x="25" y="440" width="1150" height="108" rx="9" fill="white" stroke="#dce1d7"/><rect x="35" y="450" width="310" height="83" rx="6" fill="#edf2e7"/><rect x="435" y="450" width="320" height="83" rx="6" fill="#edf2e7"/><rect x="835" y="450" width="320" height="83" rx="6" fill="#edf2e7"/><path d="M345 490 H435 M755 490 H835" stroke="#33735f" stroke-width="3" fill="none"/><circle cx="345" cy="490" r="4" fill="#33735f"/><circle cx="435" cy="490" r="4" fill="#33735f"/><circle cx="755" cy="490" r="4" fill="#33735f"/><circle cx="835" cy="490" r="4" fill="#33735f"/><text x="48" y="473" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17332f">Computer USB</text><text x="448" y="473" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17332f">USB data cable</text><text x="848" y="473" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17332f">UNO USB socket</text><text x="35" y="588" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17332f">Disconnect power before wiring. Follow the guide’s supply, polarity and variant checks.</text></svg>