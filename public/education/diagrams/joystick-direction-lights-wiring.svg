<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img"><rect width="960" height="640" fill="#f8fafc"/><rect x="18" y="18" width="924" height="604" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="46" y="65" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">Joystick-controlled 4-way LEDs</text><text x="46" y="96" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">PIN-TO-PIN WIRING MAP — disconnect USB before assembly</text><rect x="38" y="126" width="885" height="38" rx="12" fill="#dbeafe" stroke="#bfdbfe" stroke-width="2"/><text x="50" y="152" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="start">SOURCE</text><text x="329" y="152" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="start">CONNECTION / CHECK</text><text x="710" y="152" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="start">DESTINATION</text><rect x="38" y="180" width="885" height="44" fill="#f8fafc" stroke="#e2e8f0"/><text x="49" y="209" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">UNO 5V</text><text x="329" y="209" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">5 V verified</text><text x="710" y="209" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start">Joystick VCC</text><rect x="38" y="224" width="885" height="44" fill="#fff" stroke="#e2e8f0"/><text x="49" y="253" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">UNO GND</text><text x="329" y="253" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">common ground</text><text x="710" y="253" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start">Joystick GND</text><rect x="38" y="268" width="885" height="44" fill="#f8fafc" stroke="#e2e8f0"/><text x="49" y="297" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">UNO A0</text><text x="329" y="297" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">analog X</text><text x="710" y="297" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start">Joystick VRx</text><rect x="38" y="312" width="885" height="44" fill="#fff" stroke="#e2e8f0"/><text x="49" y="341" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">UNO A1</text><text x="329" y="341" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">analog Y</text><text x="710" y="341" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start">Joystick VRy</text><rect x="38" y="356" width="885" height="44" fill="#f8fafc" stroke="#e2e8f0"/><text x="49" y="385" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">UNO D5</text><text x="329" y="385" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">330 ohm series</text><text x="710" y="385" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start">LEFT LED anode</text><rect x="38" y="400" width="885" height="44" fill="#fff" stroke="#e2e8f0"/><text x="49" y="429" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">UNO D6</text><text x="329" y="429" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">330 ohm series</text><text x="710" y="429" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start">RIGHT LED anode</text><rect x="38" y="444" width="885" height="44" fill="#f8fafc" stroke="#e2e8f0"/><text x="49" y="473" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">UNO D9</text><text x="329" y="473" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">330 ohm series</text><text x="710" y="473" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start">UP LED anode</text><rect x="38" y="488" width="885" height="44" fill="#fff" stroke="#e2e8f0"/><text x="49" y="517" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">UNO D10</text><text x="329" y="517" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">330 ohm series</text><text x="710" y="517" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="start">DOWN LED anode</text><text x="47" y="560" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Each LED cathode returns to common UNO GND.</text><text x="47" y="581" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Use one 330 ohm series resistor per LED.</text><text x="47" y="602" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">SW pin not used. Joystick axes may be inverted.</text></svg>
