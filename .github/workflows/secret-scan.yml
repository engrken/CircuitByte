name: Secret scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0
      - name: Scan changed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}"; then
            range="$BASE..$HEAD"
          else
            range="-1 $HEAD"
          fi
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 --no-banner --log-opts="$range" .
