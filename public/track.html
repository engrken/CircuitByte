<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>Track your order · CircuitByte</title><link rel="stylesheet" href="app.css"><style>body{overflow:auto;background:#f0f4ef}.tracking{max-width:760px;margin:40px auto;padding:24px;font-family:system-ui}.tracking form,.tracking article{background:white;padding:24px;border-radius:16px;margin:24px 0;border:1px solid #d5ded9}.tracking input{width:100%;box-sizing:border-box;padding:14px;margin:10px 0 16px}.tracking button{padding:12px 18px;cursor:pointer}.tracking li{padding:8px 0}.tracking [role=alert]{color:#9c2626}.tracking p{line-height:1.6;overflow-wrap:anywhere}.tracking pre{white-space:pre-wrap;font:inherit}.tracking nav{display:flex;gap:16px;flex-wrap:wrap}@media print{form,nav,button{display:none!important}}</style><script src="track.js" defer></script></head><body><main class="tracking"><nav><a href="/">← CircuitByte catalog</a></nav><h1>Track your order</h1><p>Pickup / meet-up anywhere within Roxas City, Capiz. We will contact you to agree on the location and schedule.</p><form id="tracking-form"><label for="tracking-code">Private tracking code or link</label><input id="tracking-code" required autocomplete="off" spellcheck="false"><button class="primary" id="check">Check status</button><p>Keep this code private. Anyone with it can view your order and meetup details.</p></form><p id="tracking-error" role="alert"></p><article id="tracking-result" hidden aria-live="polite"></article><nav><button id="forget">Forget saved tracking code</button></nav><p>Need help? <a href="https://www.facebook.com/circuitbyteph" target="_blank" rel="noopener noreferrer">Contact CircuitByte</a> with your order reference.</p></main></body></html>
