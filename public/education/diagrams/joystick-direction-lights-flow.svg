<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img"><title>Joystick controlled direction lights — program flowchart</title><desc>Accessible visual guide showing the program flowchart for the CircuitByte Joystick controlled direction lights project. Refer to the accompanying connection table and safety notes before wiring.</desc><rect width="960" height="640" fill="#f8fafc"/><rect x="18" y="18" width="924" height="604" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="46" y="65" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">Joystick-controlled 4-way LEDs</text><text x="46" y="96" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">FLOWCHART — software behavior, not a physical circuit</text><rect x="211" y="121" width="542" height="55" rx="12" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">Initialize D5, D6, D9, D10 outputs</text><path d="M482 176 V189" fill="none" stroke="#64748b" stroke-width="2.5"/><text x="491" y="187" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">▼</text><rect x="211" y="193" width="542" height="55" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="482" y="226" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">Read joystick VRx on A0 and VRy on A1</text><path d="M482 248 V261" fill="none" stroke="#64748b" stroke-width="2.5"/><text x="491" y="259" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">▼</text><rect x="211" y="265" width="542" height="55" rx="12" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/><text x="482" y="298" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">Check center dead zone on each axis</text><path d="M482 320 V333" fill="none" stroke="#64748b" stroke-width="2.5"/><text x="491" y="331" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">▼</text><rect x="211" y="337" width="542" height="55" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="482" y="370" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">Turn on matching LED outputs</text><path d="M482 392 V405" fill="none" stroke="#64748b" stroke-width="2.5"/><text x="491" y="403" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">▼</text><rect x="211" y="409" width="542" height="55" rx="12" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/><text x="482" y="442" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">Print X and Y to Serial Monitor</text><path d="M482 464 V477" fill="none" stroke="#64748b" stroke-width="2.5"/><text x="491" y="475" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">▼</text><rect x="211" y="481" width="542" height="55" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="482" y="514" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">Repeat without delay</text><path d="M754 545 H829 V224 H754" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/><text x="836" y="400" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">repeat</text></svg>
